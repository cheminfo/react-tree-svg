<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>react-tree-svg local test</title>
    <script src="../dist/react-tree-svg.umd.js"></script>
  </head>

  <body>
    <h2>Molecules (SMILES tree)</h2>
    <div id="react-tree-svg"></div>
    <h2>Taxonomies</h2>
    <div id="taxonomies-graph" onclick="handleClick(event)"></div>
    <h2>Reaction trees</h2>
    <div id="trees-graph"></div>

    <script type="module">
      import { Molecule } from 'https://www.lactame.com/lib/openchemlib/9.22.0/openchemlib.js';

      const { render, moleculeRenderer, taxonomyRenderer } = window.TreeSVG;

      function isInRange(masses, mass, accuracyPpm) {
        if (!mass) return false;
        const tolerance = (accuracyPpm * mass) / 1e6;
        return masses.some((v) => Math.abs(v - mass) <= tolerance);
      }

      async function fetchJson(url) {
        const response = await fetch(url);
        return response.json();
      }

      const moleculeMasses = [
        105.0697, 58.065, 194.1173, 163.0752, 133.0647, 135.0439,
      ];
      const molecules = await fetchJson('data/molecules.json');
      const svgMolecules = render(molecules, {
        nodeRenderer: moleculeRenderer,
        nodeRendererOptions: {
          getMolecules: (node) =>
            node.smiles ? [Molecule.fromSmiles(node.smiles)] : [],
          getTopLabel: (node) =>
            node.mz !== undefined ? `${node.mz.toFixed(4)} m/z` : undefined,
          getBoxStyle: (node) =>
            isInRange(moleculeMasses, node.mz, 50)
              ? { fill: 'red', fillOpacity: 0.2 }
              : undefined,
        },
        positionOptions: { spacingHorizontal: 150 },
      });
      document.getElementById('react-tree-svg').innerHTML = svgMolecules;

      const taxonomies = await fetchJson('data/taxonomies.json');
      const svgTaxonomies = render(taxonomies, {
        nodeRenderer: taxonomyRenderer,
        nodeRendererOptions: { maxRankDepth: 8 },
        positionOptions: { spacingHorizontal: 100 },
      });
      document.getElementById('taxonomies-graph').innerHTML = svgTaxonomies;

      // trees.json interleaves reaction and product objects; hoist each
      // product's children up so the tree recursion finds the next reaction.
      function flattenReactionTree(nodes) {
        return nodes.map((node) => ({
          ...node,
          children: (node.products || []).flatMap((product) =>
            flattenReactionTree(product.children || []),
          ),
        }));
      }

      const treeMasses = [
        58.065, 105.0697, 133.0647, 135.0439, 163.0752, 194.1173, 530.15,
      ];
      const trees = flattenReactionTree(await fetchJson('data/trees.json'));
      const svgTrees = render(trees, {
        nodeRenderer: moleculeRenderer,
        nodeRendererOptions: {
          getMolecules: (node) => {
            const result = [];
            if (node.reactant?.idCode) {
              result.push(Molecule.fromIDCode(node.reactant.idCode));
            }
            for (const product of node.products || []) {
              if (product.idCode)
                result.push(Molecule.fromIDCode(product.idCode));
            }
            return result;
          },
          getTopLabel: (node) => node.reaction?.Label,
          getBoxStyle: (node) => {
            const mzs = [
              node.reactant?.mz,
              ...(node.products || []).map((p) => p.mz),
            ];
            return mzs.some((mz) => isInRange(treeMasses, mz, 50))
              ? { fill: 'red', fillOpacity: 0.2 }
              : undefined;
          },
        },
        positionOptions: { spacingHorizontal: 150 },
      });
      document.getElementById('trees-graph').innerHTML = svgTrees;
    </script>

    <script>
      function handleClick(event) {
        const target = event.target;
        if (target.tagName === 'text') {
          const url = target.getAttribute('data-url');
          if (url) window.open(url, '_blank');
        }
      }
    </script>
  </body>
</html>
